name: Expand SAYMERA v1.2 source

on:
  push:
    branches: [main]
    paths:
      - '.sourcepack/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=".sourcepack/SAYMERA_v1_2_source.tar.xz"
          if [ ! -f "$archive" ]; then
            echo "Source pack already expanded; nothing to do."
            exit 0
          fi

          xz -t "$archive"
          rm -rf /tmp/saymera-source
          mkdir -p /tmp/saymera-source
          tar -xJf "$archive" -C /tmp/saymera-source

          source_root="/tmp/saymera-source"
          shopt -s nullglob dotglob
          entries=(/tmp/saymera-source/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_root="${entries[0]}"
          fi

          for entry in "$source_root"/*; do
            cp -a "$entry" ./
          done

          rm -rf .bootstrap .sourcepack

          git config user.name "SAYMERA bootstrap"
          git config user.email "115743794+mehmetyildiz03@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Import SAYMERA v1.2 source"
          git push origin HEAD:main
