name: Import SAYMERA v1.2 source

on:
  push:
    branches: [main]
    paths:
      - '.sourcepack/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and import source pack
        shell: bash
        run: |
          set -euo pipefail

          required=(
            .sourcepack/p00
            .sourcepack/p01
            .sourcepack/p02
            .sourcepack/p030
            .sourcepack/p031
            .sourcepack/p032
            .sourcepack/p033
            .sourcepack/p040
            .sourcepack/p041
            .sourcepack/p042
            .sourcepack/p043
            .sourcepack/p050
            .sourcepack/p051
            .sourcepack/p052
            .sourcepack/p053
            .sourcepack/p060
            .sourcepack/p061
            .sourcepack/p062
            .sourcepack/p063
          )

          for part in "${required[@]}"; do
            if [ ! -f "$part" ]; then
              echo "Waiting for all source-pack parts; missing: $part"
              exit 0
            fi
          done

          cat "${required[@]}" > /tmp/saymera-source.b64
          echo "35fba8acdc34f758ba6c32e2dd72719e2def3de42726e7749b61f3d0b0b0256d  /tmp/saymera-source.b64" | sha256sum -c -

          base64 --decode /tmp/saymera-source.b64 > /tmp/saymera-source.tar.xz
          echo "e0084887207fc5073e34db557dc70df1daed82026f03157a87416dc65f6ab375  /tmp/saymera-source.tar.xz" | sha256sum -c -
          xz -t /tmp/saymera-source.tar.xz

          rm -rf /tmp/saymera-source
          mkdir -p /tmp/saymera-source
          tar -xJf /tmp/saymera-source.tar.xz -C /tmp/saymera-source

          source_root="/tmp/saymera-source"
          shopt -s nullglob dotglob
          entries=(/tmp/saymera-source/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_root="${entries[0]}"
          fi

          for entry in "$source_root"/*; do
            cp -a "$entry" ./
          done

          rm -rf .bootstrap .sourcepack
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          npm test

          git config user.name "SAYMERA import"
          git config user.email "115743794+mehmetyildiz03@users.noreply.github.com"
          git add -A
          git commit -m "Import SAYMERA v1.2 source"
          git push origin HEAD:main
