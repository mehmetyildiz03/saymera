name: Apply SAYMERA v1.5.2

on:
  push:
    paths:
      - '.maintenance/v1.5.2/apply.py'
      - '.github/workflows/apply-v1-5-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore exact v1.5.0 P2 curriculum scope
        run: git revert --no-commit 31e70731bda19cecbbe2b8614f7a48548dceccb2
      - name: Apply curriculum-exact improvements
        run: python .maintenance/v1.5.2/apply.py
      - name: Validate
        run: npm test
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance/v1.5.2
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-v1-5-2.yml
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Keep P2 curriculum exact and make P1 grid copying interactive'
          git push origin HEAD:main
