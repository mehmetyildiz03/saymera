name: Apply SAYMERA v1.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1-2-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .patches/v1.2.1-source.patch.xz.b64 | xz -d > /tmp/saymera.patch
          git apply --check /tmp/saymera.patch
          git apply /tmp/saymera.patch
          npm test
          rm -f .patches/v1.2.1-source.patch.xz.b64 .github/workflows/apply-v1-2-1.yml
          rmdir .patches 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Make child practice copy and Grade 2 solids task-authentic'
          git push origin HEAD:main
