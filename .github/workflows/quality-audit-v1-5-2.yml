name: SAYMERA P1 P2 Quality Audit

on:
  push:
    paths:
      - '.maintenance/quality-audit-v1.5.2.mjs'
      - '.github/workflows/quality-audit-v1-5-2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run repetition and child-language audit
        run: node .maintenance/quality-audit-v1.5.2.mjs
