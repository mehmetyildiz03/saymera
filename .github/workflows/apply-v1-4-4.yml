name: Apply SAYMERA v1.4.4

on:
  push:
    paths:
      - '.maintenance/v1.4.4/apply.py'
      - '.maintenance/v1.4.4/fix.py'
      - '.maintenance/v1.4.4/fix_ui.py'
      - '.github/workflows/apply-v1-4-4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair migration anchor
        run: python .maintenance/v1.4.4/fix.py
      - name: Apply P2 measurement time money migration
        run: python .maintenance/v1.4.4/apply.py
      - name: Add P2-C component styles
        run: python .maintenance/v1.4.4/fix_ui.py
      - name: Validate
        run: npm test
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance/v1.4.4
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-v1-4-4.yml
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate Singapore P2 measurement time and money'
          git push origin HEAD:main
