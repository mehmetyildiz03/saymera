name: Apply SAYMERA v1.5.4

on:
  push:
    paths:
      - '.maintenance/v1.5.4/apply.py'
      - '.github/workflows/apply-v1-5-4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply practice variation hardening
        run: python .maintenance/v1.5.4/apply.py
      - name: Validate full suite
        run: npm test
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance/v1.5.4
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-v1-5-4.yml
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Vary practice prompts without weakening concept repetition'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
