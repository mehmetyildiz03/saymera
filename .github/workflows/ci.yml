name: SAYMERA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate SAYMERA
        run: npm test
  pattern-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify number-pattern phone and tablet interactions
        run: node tests/pattern-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: number-pattern-browser-screenshots
          path: test-results/
