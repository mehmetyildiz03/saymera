name: Apply SAYMERA v1.5.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1-5-5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply freehand fraction paint migration
        run: python .maintenance/v1.5.5/apply.py
      - name: Validate full suite
        run: npm test
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance/v1.5.5
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-v1-5-5.yml
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Add freehand fraction painting with tolerant intent recognition'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
