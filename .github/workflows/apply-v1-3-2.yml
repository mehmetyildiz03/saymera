name: Apply SAYMERA v1.3.2

on:
  push:
    branches: [main]
    paths:
      - '.maintenance/v1.3.2/**'
      - '.github/workflows/apply-v1-3-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply completion/time fixes
        run: python .maintenance/v1.3.2/apply.py
      - name: Validate
        run: npm test
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance/v1.3.2
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-v1-3-2.yml
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Gate learning completion on successful consolidation'
          git push origin HEAD:main
