name: Apply SAYMERA v1.4.3

on:
  push:
    paths:
      - '.maintenance/v1.4.3/apply.py'
      - '.github/workflows/apply-v1-4-3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P2 multiplication and division migration
        run: python .maintenance/v1.4.3/apply.py
      - name: Validate
        run: npm test
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance/v1.4.3
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-v1-4-3.yml
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Singapore P2 multiplication and division progression'
          git push origin HEAD:main
