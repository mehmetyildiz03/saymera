name: Apply SAYMERA v1.5.1

on:
  push:
    paths:
      - '.maintenance/v1.5.1/apply.py'
      - '.github/workflows/apply-v1-5-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply P2 geometry completeness fixes
        run: python .maintenance/v1.5.1/apply.py
      - name: Validate
        run: npm test
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .maintenance/v1.5.1
          rmdir .maintenance 2>/dev/null || true
          rm -f .github/workflows/apply-v1-5-1.yml
          git config user.name 'SAYMERA maintenance'
          git config user.email '115743794+mehmetyildiz03@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Singapore P2 geometry learning experiences'
          git push origin HEAD:main
